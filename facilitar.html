<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilitar sesión — Assessment Agile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1117; --ink-muted: #5a5f72; --ink-faint: #9198aa;
  --surface: #fafaf8; --surface-2: #f2f1ed; --border: #dddbd4;
  --accent: #1a4fd6; --accent-light: #dce6ff;
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #0d0f18;
  color: #f0efe9;
  height: 100vh;
  overflow: hidden;
}
#app { height: 100vh; display: flex; flex-direction: column; }

/* Login */
.login-wrap { display:flex; align-items:center; justify-content:center; height:100vh; background:var(--surface); }
.login-card { background:white; border-radius:var(--radius); padding:36px; max-width:360px; width:90%; box-shadow:0 8px 40px rgba(0,0,0,.12); }
.login-card h2 { font-family:'DM Serif Display',serif; font-size:22px; color:var(--ink); margin-bottom:6px; }
.login-card p  { font-size:13px; color:var(--ink-muted); margin-bottom:22px; }
.fg { margin-bottom:14px; }
.fg label { display:block; font-size:11px; font-weight:600; color:var(--ink-muted); margin-bottom:5px; letter-spacing:.04em; text-transform:uppercase; }
.fi { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; font-size:14px; font-family:inherit; color:var(--ink); background:white; outline:none; }
.fi:focus { border-color:var(--accent); }
.btn-p { display:inline-flex; align-items:center; justify-content:center; padding:10px 20px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; border:none; background:var(--accent); color:white; font-family:inherit; }
.btn-p:disabled { opacity:.55; cursor:default; }
.lerr { font-size:12px; color:#c0282a; min-height:16px; margin-bottom:10px; }

/* Presenter shell */
.presenter { display:flex; flex-direction:column; height:100vh; }

/* Slide stage */
.stage { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 40px; overflow:hidden; min-height:0; }
.slide-card {
  background:white;
  border-radius:18px;
  padding:clamp(32px,5vw,64px);
  max-width:860px;
  width:100%;
  box-shadow:0 28px 90px rgba(0,0,0,.5);
  max-height:100%;
  overflow-y:auto;
  color:var(--ink);
}
.slide-card::-webkit-scrollbar { width:4px; }
.slide-card::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* Slide content */
.s-eyebrow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.s-h1 { font-family:'DM Serif Display',serif; font-size:clamp(30px,5vw,54px); color:var(--ink); line-height:1.1; margin-bottom:12px; }
.s-h2 { font-family:'DM Serif Display',serif; font-size:clamp(22px,3.5vw,38px); color:var(--ink); line-height:1.2; margin-bottom:12px; }
.s-meta { font-size:14px; color:var(--ink-faint); margin-bottom:20px; }
.score-row { display:flex; align-items:baseline; gap:14px; margin:20px 0 6px; }
.score-num { font-family:'DM Serif Display',serif; font-size:clamp(40px,6vw,68px); line-height:1; }
.level-tag { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 12px; border-radius:99px; }
.dim-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:24px; }
.dim-chip { border-radius:var(--radius-sm); padding:12px 14px; border:1.5px solid var(--border); }
.dim-chip-label { font-size:10px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
.dim-chip-pct { font-size:22px; font-weight:700; }
.q-list { list-style:none; display:flex; flex-direction:column; gap:14px; margin-top:26px; }
.q-list li { display:flex; gap:12px; align-items:flex-start; font-size:clamp(14px,1.8vw,17px); color:var(--ink-muted); line-height:1.65; }
.q-num { flex-shrink:0; width:26px; height:26px; border-radius:99px; background:var(--accent-light); color:var(--accent); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px; }
.s-text { font-size:clamp(14px,1.8vw,16px); color:var(--ink-muted); line-height:1.85; white-space:pre-wrap; margin-top:22px; }
.cierre-q { font-family:'DM Serif Display',serif; font-size:clamp(18px,2.5vw,28px); color:var(--ink); line-height:1.45; font-style:italic; margin-top:22px; padding:24px 28px; background:var(--surface-2); border-radius:var(--radius); border-left:4px solid var(--accent); }
.s-caption { font-size:13px; color:var(--ink-faint); margin-top:10px; }

/* Control bar */
.ctrlbar {
  background:rgba(255,255,255,.05);
  border-top:1px solid rgba(255,255,255,.07);
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  position:relative;
}
.progress-rail { position:absolute; top:0; left:0; right:0; height:2px; background:rgba(255,255,255,.07); }
.progress-bar  { height:100%; background:var(--accent); transition:width .28s; }
.cb-btn { padding:7px 15px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; cursor:pointer; border:1.5px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#d8d7d0; font-family:inherit; transition:background .15s; white-space:nowrap; }
.cb-btn:hover:not(:disabled) { background:rgba(255,255,255,.12); }
.cb-btn:disabled { opacity:.3; cursor:default; }
.cb-btn.on { background:rgba(26,79,214,.3); border-color:rgba(26,79,214,.55); color:#93b4ff; }
.cb-center { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
.cb-title { font-size:12px; color:rgba(255,255,255,.45); text-align:center; }
.cb-counter { font-size:11px; color:rgba(255,255,255,.25); font-weight:600; letter-spacing:.06em; }

/* Notes panel */
.notes-panel {
  background:#14172200;
  background:linear-gradient(180deg,#14172280 0%,#0d0f18 100%);
  border-top:1px solid rgba(255,255,255,.06);
  padding:16px 28px 20px;
  max-height:200px;
  overflow-y:auto;
  flex-shrink:0;
  animation:slidein .2s ease;
}
@keyframes slidein { from { transform:translateY(10px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.notes-panel::-webkit-scrollbar { width:3px; }
.notes-panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); }
.n-header { font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.25); margin-bottom:8px; margin-top:12px; }
.n-header:first-child { margin-top:0; }
.n-item { font-size:12px; color:rgba(255,255,255,.6); line-height:1.75; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.05); }
.n-item:last-child { border-bottom:none; }
.n-item strong { color:rgba(255,255,255,.85); }
.n-ai  { font-size:12px; color:rgba(147,180,255,.7); line-height:1.75; white-space:pre-wrap; }
.n-warn { color:rgba(255,170,80,.75) !important; }
.n-empty { font-size:12px; color:rgba(255,255,255,.2); font-style:italic; }
.kbd { background:rgba(255,255,255,.1); border-radius:3px; padding:1px 5px; font-size:10px; font-family:monospace; color:rgba(255,255,255,.4); }

/* Action form (cierre slide) */
.action-section { margin-top:28px; border-top:1.5px solid var(--border); padding-top:22px; }
.action-toggle { display:inline-flex; align-items:center; gap:7px; padding:8px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--accent); background:var(--accent-light); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.action-toggle:hover { background:#c8d9ff; }
.action-form { margin-top:16px; display:flex; flex-direction:column; gap:12px; background:var(--surface-2); border-radius:var(--radius); padding:18px 20px; }
.af-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.af-field { display:flex; flex-direction:column; gap:5px; }
.af-field label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
.af-field input, .af-field select { border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; font-family:inherit; color:var(--ink); background:white; outline:none; }
.af-field input:focus, .af-field select:focus { border-color:var(--accent); }
.af-save { align-self:flex-end; padding:9px 20px; border-radius:var(--radius-sm); background:var(--accent); color:white; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.af-save:disabled { opacity:.5; cursor:default; }
.action-list { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
.action-item { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-radius:var(--radius-sm); background:#f0faf3; border:1.5px solid #c3e8cc; }
.action-check { color:#2d9b52; font-size:14px; flex-shrink:0; margin-top:1px; }
.action-text { flex:1; }
.action-text strong { font-size:13px; color:var(--ink); display:block; margin-bottom:2px; }
.action-text span { font-size:11px; color:var(--ink-faint); }

/* Loading / error */
.loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:10px; }
.loading-screen p { font-size:14px; color:rgba(255,255,255,.35); }
.loading-screen p.sub { font-size:12px; color:rgba(255,255,255,.2); }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><p>Iniciando…</p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="assets/escape.js"></script>
<script src="assessment-config.js"></script>
<script>
// ── Firebase ────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDcsMNbGqwmkbgg3k41dPfKCEgWMnX0SaM",
  authDomain: "agile-assessment-5a117.firebaseapp.com",
  projectId: "agile-assessment-5a117",
  storageBucket: "agile-assessment-5a117.firebasestorage.app",
  messagingSenderId: "41571782884",
  appId: "1:41571782884:web:e8b96178aeffc4649edcf1"
};
firebase.initializeApp(firebaseConfig);
const db   = firebase.firestore();
const auth = firebase.auth();

// ── State ───────────────────────────────────────────────────────────
let currentUser = null, loginErr = '', loading = true;
let teamId = '', teamName = '', cicloNombre = '', workspaceId = '';
let slides = [], currentSlide = 0, coachMode = true;
let aiData = null, dimScores = {}, globalPct = null, responseCount = 0;

// Action form state (cierre slide)
let showActionForm = false;
let sessionActions = [];
let actionSaving = false;

// ── Render ──────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = buildApp();
  attachKb();
}

function buildApp() {
  if (loading) return `<div class="loading-screen"><p>Cargando sesión…</p></div>`;
  if (!currentUser) return buildLogin();
  if (!teamId) return `<div class="loading-screen">
    <p>Sin equipo seleccionado.</p>
    <p class="sub">Abre esta página desde el panel de administración usando el botón <strong>Facilitar →</strong>.</p>
  </div>`;
  if (!slides.length) return `<div class="loading-screen">
    <p>Sin datos para esta sesión.</p>
    <p class="sub">Verifica que el equipo y ciclo tengan respuestas registradas.</p>
  </div>`;
  return buildPresenter();
}

// ── Login ───────────────────────────────────────────────────────────
function buildLogin() {
  return `<div class="login-wrap"><div class="login-card">
    <h2>Modo facilitación</h2>
    <p>Inicia sesión con tu cuenta de coach para acceder.</p>
    <div class="fg"><label>Email</label>
      <input class="fi" type="email" id="fEmail" placeholder="tu@email.com"
        onkeydown="if(event.key==='Enter')document.getElementById('fPw').focus()"/></div>
    <div class="fg"><label>Contraseña</label>
      <input class="fi" type="password" id="fPw" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="lerr" id="lerr">${loginErr}</div>
    <button class="btn-p" id="loginBtn" onclick="doLogin()">Ingresar →</button>
  </div></div>`;
}

async function doLogin() {
  const email = (document.getElementById('fEmail').value || '').trim();
  const pw    = document.getElementById('fPw').value;
  if (!email || !pw) { document.getElementById('lerr').textContent = 'Ingresa email y contraseña'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) {
    loginErr = 'Email o contraseña incorrectos';
    render();
  }
}

// ── Presenter ───────────────────────────────────────────────────────
function buildPresenter() {
  const slide  = slides[currentSlide];
  const isFirst = currentSlide === 0;
  const isLast  = currentSlide === slides.length - 1;
  const pct     = ((currentSlide + 1) / slides.length * 100).toFixed(1);
  const title   = slideTitle(slide);

  return `<div class="presenter">
    <div class="stage">
      <div class="slide-card">${buildSlide(slide)}</div>
    </div>
    <div class="ctrlbar">
      <div class="progress-rail"><div class="progress-bar" style="width:${pct}%"></div></div>
      <button class="cb-btn" onclick="navigate(-1)" ${isFirst?'disabled':''}>← Anterior</button>
      <div class="cb-center">
        <span class="cb-title">${title}</span>
        <span class="cb-counter">${currentSlide+1} / ${slides.length} &nbsp;·&nbsp; <span class="kbd">←</span> <span class="kbd">→</span> &nbsp;·&nbsp; <span class="kbd">N</span> notas</span>
      </div>
      <button class="cb-btn ${coachMode?'on':''}" onclick="toggleCoach()">${coachMode?'Notas ▲':'Notas ▼'}</button>
      <button class="cb-btn" onclick="exportSession()" title="Exportar resumen de la sesión para imprimir">↓ Exportar</button>
      <button class="cb-btn" onclick="navigate(1)" ${isLast?'disabled':''}>Siguiente →</button>
    </div>
    ${coachMode ? `<div class="notes-panel">${buildNotes(slide)}</div>` : ''}
  </div>`;
}

// ── Slide builders ──────────────────────────────────────────────────
function buildSlide(slide) {
  if (slide.type === 'cover')        return buildCover();
  if (slide.type === 'dimension')    return buildDim(slide.dimKey);
  if (slide.type === 'ai_narrativa') return buildAiSlide('Contexto del equipo', aiData.narrativa);
  if (slide.type === 'ai_foco')      return buildAiSlide('Foco recomendado', aiData.focusSesion);
  if (slide.type === 'cierre')       return buildCierre();
  return '';
}

function buildCover() {
  const today   = new Date().toLocaleDateString('es', { day:'numeric', month:'long', year:'numeric' });
  const lv      = globalPct !== null ? getLevel(globalPct) : null;
  const lvTag   = lv ? `<span class="level-tag" style="background:${lv.bg};color:${lv.color}">${lv.label}</span>` : '';
  const scoreBadge = globalPct !== null
    ? `<div class="score-row"><span class="score-num">${globalPct}%</span>${lvTag}</div>
       <p class="s-caption">${responseCount} respuesta${responseCount!==1?'s':''} · ${e(cicloNombre||'Ciclo activo')}</p>`
    : `<p class="s-caption" style="margin-top:18px">Sin datos del ciclo</p>`;

  const grid = Object.keys(dimScores).length
    ? `<div class="dim-grid">${DIMS.map(d => {
        const s = dimScores[d.key]; if (!s) return '';
        return `<div class="dim-chip">
          <div class="dim-chip-label">${d.label}</div>
          <div class="dim-chip-pct" style="color:${d.color}">${s.pct}%</div>
        </div>`;
      }).join('')}</div>` : '';

  return `<div class="s-eyebrow">Sesión de facilitación</div>
    <h1 class="s-h1">${e(teamName||'Equipo')}</h1>
    <p class="s-meta">${e(cicloNombre||'')}${cicloNombre?' · ':''}${today}</p>
    ${scoreBadge}${grid}`;
}

function buildDim(dimKey) {
  const dim = DIMS.find(d => d.key === dimKey);
  const sec = SECTIONS.find(s => s.id === dimKey);
  if (!dim || !sec) return '';

  const s   = dimScores[dimKey];
  const pct = s ? s.pct : null;
  const lv  = pct !== null ? getLevel(pct) : null;

  const scoreLine = pct !== null
    ? `<div class="score-row">
        <span class="score-num" style="color:${dim.color}">${pct}%</span>
        ${lv ? `<span class="level-tag" style="background:${lv.bg};color:${lv.color}">${lv.label}</span>` : ''}
       </div>`
    : '';

  const lvIdx = pct === null ? 1 : pct <= 33 ? 0 : pct <= 66 ? 1 : 2;
  const qs = (COACHING_QUESTIONS[dimKey]||[])[lvIdx]||[];

  return `<div class="s-eyebrow" style="color:${dim.color}">${e(sec.title)}</div>
    <h2 class="s-h2">${e(sec.desc)}</h2>
    ${scoreLine}
    <ul class="q-list">${qs.map((q,i)=>`<li><span class="q-num">${i+1}</span><span>${e(q)}</span></li>`).join('')}</ul>`;
}

function buildAiSlide(title, text) {
  return `<div class="s-eyebrow">Análisis con IA</div>
    <h2 class="s-h2">${e(title)}</h2>
    <p class="s-text">${e(text||'')}</p>`;
}

function buildCierre() {
  const dimOptions = DIMS.map(d =>
    `<option value="${e(d.key)}">${e(d.label)}</option>`
  ).join('');

  const formHtml = showActionForm ? `
    <div class="action-form">
      <div class="af-field">
        <label>Iniciativa / acción</label>
        <input id="af-iniciativa" type="text" placeholder="Ej: Definir Sprint Goal con el equipo el próximo lunes" maxlength="200"/>
      </div>
      <div class="af-row">
        <div class="af-field">
          <label>Responsable</label>
          <input id="af-responsable" type="text" placeholder="Nombre o rol"/>
        </div>
        <div class="af-field">
          <label>Fecha objetivo</label>
          <input id="af-fecha" type="date"/>
        </div>
      </div>
      <div class="af-row">
        <div class="af-field">
          <label>Dimensión</label>
          <select id="af-dimension">
            <option value="">— Sin dimensión —</option>
            ${dimOptions}
          </select>
        </div>
        <div class="af-field" style="justify-content:flex-end">
          <button class="af-save" id="af-btn" onclick="saveAction()" ${actionSaving?'disabled':''}>
            ${actionSaving ? 'Guardando…' : '✓ Guardar acción'}
          </button>
        </div>
      </div>
    </div>` : '';

  const actionListHtml = sessionActions.length ? `
    <div class="action-list">
      ${sessionActions.map(a => `
        <div class="action-item">
          <span class="action-check">✓</span>
          <div class="action-text">
            <strong>${e(a.iniciativa)}</strong>
            <span>${e(a.responsable||'Sin responsable')}${a.fechaObjetivo ? ' · ' + a.fechaObjetivo : ''}${a.dimension ? ' · ' + e(a.dimLabel||a.dimension) : ''}</span>
          </div>
        </div>`).join('')}
    </div>` : '';

  return `<div class="s-eyebrow">Cierre de sesión</div>
    <h2 class="s-h2">Compromisos del equipo</h2>
    <div class="cierre-q">¿Cuál es la acción más importante que el equipo puede comprometerse a hacer antes del próximo Sprint?</div>
    <p style="font-size:14px;color:var(--ink-faint);margin-top:18px;line-height:1.7">Cada persona nombra un compromiso concreto. Captúralos directamente en el Plan de Acción.</p>
    <div class="action-section">
      <button class="action-toggle" onclick="toggleActionForm()">
        ${showActionForm ? '✕ Cancelar' : '+ Nueva acción'}
      </button>
      ${formHtml}
      ${actionListHtml}
    </div>`;
}

// ── Notes builders ──────────────────────────────────────────────────
function buildNotes(slide) {
  if (slide.type === 'cover')        return buildCoverNotes();
  if (slide.type === 'dimension')    return buildDimNotes(slide.dimKey);
  if (slide.type === 'ai_narrativa') return `<div class="n-header">Nota del coach</div>
    <p class="n-item">Comparte la narrativa en voz alta. Pregunta: <strong>¿Esto resuena con el equipo? ¿Hay algo que matizarías?</strong></p>`;
  if (slide.type === 'ai_foco')      return `<div class="n-header">Nota del coach</div>
    <p class="n-item">Usa el foco para enfocar el debate. Invita al equipo a validar o cuestionar la recomendación de IA.</p>`;
  if (slide.type === 'cierre')       return buildCierreNotes();
  return `<p class="n-empty">Sin notas para este slide.</p>`;
}

function buildCoverNotes() {
  const resumen = aiData && aiData.resumenEjecutivo
    ? `<div class="n-header">Resumen ejecutivo (IA)</div><p class="n-ai">${e(aiData.resumenEjecutivo)}</p>`
    : '';
  return `${resumen}
    <div class="n-header">Apertura sugerida</div>
    <p class="n-item"><strong>Encuadre:</strong> "Este assessment es un espejo colectivo, no una evaluación individual. Vamos a usarlo para decidir dónde enfocar nuestra energía."</p>
    <p class="n-item"><strong>Confidencialidad:</strong> Confirma que los resultados son del equipo y no se comparten hacia arriba sin su consentimiento.</p>
    <p class="n-item"><strong>Duración:</strong> 90 minutos. Puedes ajustar cuánto tiempo dedicas a cada dimensión.</p>`;
}

function buildDimNotes(dimKey) {
  const s    = dimScores[dimKey];
  const pct  = s ? s.pct : null;
  const lvIdx = pct === null ? 1 : pct <= 33 ? 0 : pct <= 66 ? 1 : 2;
  const qs   = (COACHING_QUESTIONS[dimKey]||[])[lvIdx]||[];

  const alertas = aiData && Array.isArray(aiData.alertas)
    ? aiData.alertas.filter(a => typeof a === 'string' && a.toLowerCase().includes(dimKey.slice(0,5)))
    : [];

  const alertHtml = alertas.length
    ? `<div class="n-header">Alertas IA</div>${alertas.map(a=>`<p class="n-item n-warn">⚠ ${e(a)}</p>`).join('')}`
    : '';

  const qHtml = qs.map((q,i) => `<p class="n-item"><strong>P${i+1}</strong> ${e(q)}</p>`).join('');

  return `${alertHtml}
    <div class="n-header">Preguntas de coaching${pct!==null?' · '+pct+'%':''}</div>
    ${qHtml}
    <p class="n-item" style="color:rgba(255,255,255,.2);font-size:11px;margin-top:4px">→ Elige 1–2 preguntas según la energía del equipo.</p>`;
}

function buildCierreNotes() {
  const foco   = aiData && aiData.focusSesion   ? `<div class="n-header">Foco recomendado (IA)</div><p class="n-ai">${e(aiData.focusSesion)}</p>`   : '';
  const agenda = aiData && aiData.agendaSesion  ? `<div class="n-header">Agenda sugerida (IA)</div><p class="n-ai">${e(aiData.agendaSesion)}</p>`  : '';
  const sintesis = aiData && aiData.sintesisComentarios ? `<div class="n-header">Síntesis de comentarios (IA)</div><p class="n-ai">${e(aiData.sintesisComentarios)}</p>` : '';
  const fallback = (!foco && !agenda)
    ? `<div class="n-header">Cierre sugerido</div>
       <p class="n-item"><strong>Compromisos:</strong> Recoge uno por persona, concreto y con fecha. Vincúlalos al Plan de Acción.</p>
       <p class="n-item"><strong>Seguimiento:</strong> Agenda revisión en la próxima Retro.</p>`
    : '';
  return `${foco}${agenda}${sintesis}${fallback}`;
}

// ── Export session ───────────────────────────────────────────────────
function exportSession() {
  const today = new Date().toLocaleDateString('es', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const lv    = globalPct !== null ? getLevel(globalPct) : null;

  const dimRows = DIMS.map(d => {
    const sec   = SECTIONS.find(s => s.id === d.key);
    const sc    = dimScores[d.key];
    const pct   = sc ? sc.pct : null;
    const lvIdx = pct === null ? 1 : pct <= 33 ? 0 : pct <= 66 ? 1 : 2;
    const qs    = (COACHING_QUESTIONS[d.key] || [])[lvIdx] || [];
    const lvDim = pct !== null ? getLevel(pct) : null;
    const qHtml = qs.map((q, i) => `<li>${q}</li>`).join('');
    return `
      <div class="dim-block">
        <div class="dim-head">
          <span class="dim-name">${sec ? sec.title : d.label}</span>
          ${pct !== null ? `<span class="dim-score">${pct}%</span>` : ''}
          ${lvDim ? `<span class="dim-lv">${lvDim.label}</span>` : ''}
        </div>
        ${qHtml ? `<ul class="dim-qs">${qHtml}</ul>` : ''}
      </div>`;
  }).join('');

  const actionsHtml = sessionActions.length
    ? `<div class="section">
        <div class="section-title">Acciones acordadas en sesión</div>
        <table class="actions-table">
          <thead><tr><th>Acción / Iniciativa</th><th>Responsable</th><th>Fecha</th><th>Dimensión</th></tr></thead>
          <tbody>${sessionActions.map(a => `
            <tr>
              <td>${a.iniciativa}</td>
              <td>${a.responsable||''}</td>
              <td>${a.fechaObjetivo||''}</td>
              <td>${a.dimLabel||a.dimension||''}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '';

  const blankLines = Array(6).fill('<div class="blank-line"></div>').join('');

  const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sesión de facilitación — ${e(teamName)}</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #1a1a2e; margin: 0; padding: 32px 40px; font-size: 13px; }
  .header { border-bottom: 2px solid #1a4fd6; padding-bottom: 16px; margin-bottom: 24px; }
  .header h1 { font-size: 22px; margin: 0 0 4px; }
  .header .meta { font-size: 12px; color: #666; }
  .global-score { display: inline-block; background: #f0f5ff; border: 1.5px solid #1a4fd6; border-radius: 8px; padding: 8px 18px; margin: 12px 0; }
  .global-score .num { font-size: 28px; font-weight: 700; color: #1a4fd6; }
  .global-score .lv  { font-size: 12px; font-weight: 700; color: #444; margin-left: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .section { margin-bottom: 24px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #888; margin-bottom: 10px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .dims-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dim-block { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; }
  .dim-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dim-name { font-weight: 700; font-size: 12px; flex: 1; }
  .dim-score { font-size: 16px; font-weight: 700; color: #1a4fd6; }
  .dim-lv { font-size: 10px; color: #888; }
  .dim-qs { margin: 0; padding-left: 16px; font-size: 11px; color: #444; line-height: 1.7; }
  .actions-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .actions-table th { background: #f3f4f6; font-weight: 700; padding: 6px 8px; text-align: left; border: 1px solid #e5e7eb; }
  .actions-table td { padding: 6px 8px; border: 1px solid #e5e7eb; vertical-align: top; }
  .blank-lines { margin-top: 12px; }
  .blank-line { border-bottom: 1px solid #ccc; height: 28px; margin-bottom: 4px; }
  .commit-prompt { font-style: italic; color: #444; margin-bottom: 16px; font-size: 13px; }
  @media print { body { padding: 24px; } }
</style>
</head>
<body>
  <div class="header">
    <h1>${e(teamName || 'Equipo')}</h1>
    <div class="meta">Sesión de facilitación · ${e(cicloNombre || 'Ciclo activo')} · ${today}</div>
    ${globalPct !== null ? `<div class="global-score"><span class="num">${globalPct}%</span>${lv ? `<span class="lv">${lv.label}</span>` : ''}</div>` : ''}
  </div>

  <div class="section">
    <div class="section-title">Preguntas de coaching por dimensión</div>
    <div class="dims-grid">${dimRows}</div>
  </div>

  ${actionsHtml}

  <div class="section">
    <div class="section-title">Compromisos del equipo</div>
    <p class="commit-prompt">¿Cuál es la acción más importante que el equipo puede comprometerse a hacer antes del próximo Sprint?</p>
    <div class="blank-lines">${blankLines}</div>
  </div>

  <script>window.onload = function(){ window.print(); }<\/script>
</body>
</html>`;

  const w = window.open('', '_blank', 'width=900,height=700');
  if (w) { w.document.write(html); w.document.close(); }
}

// ── Action form ─────────────────────────────────────────────────────
function toggleActionForm() {
  showActionForm = !showActionForm;
  render();
  if (showActionForm) {
    // Focus the first field after render
    setTimeout(() => {
      const el = document.getElementById('af-iniciativa');
      if (el) el.focus();
    }, 50);
  }
}

async function saveAction() {
  const iniciativa = (document.getElementById('af-iniciativa').value || '').trim();
  if (!iniciativa) {
    document.getElementById('af-iniciativa').focus();
    return;
  }
  const responsable = (document.getElementById('af-responsable').value || '').trim();
  const fechaObjetivo = document.getElementById('af-fecha').value || '';
  const dimension = document.getElementById('af-dimension').value || '';
  const dimLabel = dimension ? (DIMS.find(d => d.key === dimension) || {}).label || dimension : '';

  actionSaving = true;
  render();

  const planData = {
    equipoId: teamId,
    equipoNombre: teamName || teamId,
    iniciativa,
    responsable,
    fechaObjetivo,
    estado: 'pendiente',
    ciclo: cicloNombre || '',
    dimension,
    ownerId: workspaceId || currentUser.uid,
    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('planes').add(planData);
    sessionActions.push({ iniciativa, responsable, fechaObjetivo, dimension, dimLabel });
    showActionForm = false;
  } catch(err) {
    console.error('Error al guardar acción:', err);
    alert('No se pudo guardar la acción. Verifica tu conexión.');
  }
  actionSaving = false;
  render();
}

// ── Helpers ─────────────────────────────────────────────────────────
// e() → assets/escape.js (cubre las 5 entidades).

function slideTitle(slide) {
  if (slide.type === 'cover')        return 'Portada';
  if (slide.type === 'ai_narrativa') return 'Contexto del equipo';
  if (slide.type === 'ai_foco')      return 'Foco recomendado';
  if (slide.type === 'cierre')       return 'Cierre';
  if (slide.type === 'dimension') {
    const sec = SECTIONS.find(s => s.id === slide.dimKey);
    return sec ? sec.title : slide.dimKey;
  }
  return '';
}

function navigate(delta) {
  const next = currentSlide + delta;
  if (next < 0 || next >= slides.length) return;
  currentSlide = next;
  render();
  const card = document.querySelector('.slide-card');
  if (card) card.scrollTop = 0;
}

function toggleCoach() { coachMode = !coachMode; render(); }

function attachKb() {
  document.onkeydown = (ev) => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (['ArrowRight','ArrowDown','PageDown'].includes(ev.key)) { navigate(1);  ev.preventDefault(); }
    if (['ArrowLeft', 'ArrowUp',  'PageUp'  ].includes(ev.key)) { navigate(-1); ev.preventDefault(); }
    if (ev.key === 'n' || ev.key === 'N') { toggleCoach(); }
  };
}

// ── Data loading ────────────────────────────────────────────────────
async function loadData(uid, cicloParam) {
  const ownerId = workspaceId || uid;

  if (teamId) {
    try {
      const tSnap = await db.collection('equipos').doc(teamId).get();
      teamName = tSnap.exists ? tSnap.data().nombre : teamId;
    } catch(e) { teamName = teamId; }
  }

  if (cicloParam) {
    cicloNombre = cicloParam;
  } else {
    try {
      const cSnap = await db.collection('ciclos').where('ownerId','==',ownerId).get();
      const active = cSnap.docs.find(d => !!d.data().activo);
      cicloNombre = active ? (active.data().nombre||'') : '';
    } catch(e) { cicloNombre = ''; }
  }

  try {
    let q = db.collection('respuestas');
    if (teamId)      q = q.where('equipoId','==',teamId);
    if (cicloNombre) q = q.where('ciclo',   '==',cicloNombre);
    const rSnap = await q.get();
    const resps = rSnap.docs.map(d => d.data());
    responseCount = resps.length;
    if (resps.length) {
      const sc = {};
      DIMS.forEach(d => {
        const vals = resps.map(r => r[d.storeKey]||0);
        const avg  = vals.reduce((s,v)=>s+v,0)/vals.length;
        sc[d.key]  = { avg, pct: Math.round((avg/d.max)*100) };
      });
      dimScores = sc;
      globalPct = Math.round(resps.reduce((s,r)=>s+(r.scoreTotalPct||0),0)/resps.length);
    }
  } catch(err) {}

  if (teamId && cicloNombre) {
    try {
      const aiSnap = await db.collection('analisis_ia').doc(`${teamId}_${cicloNombre}`).get();
      aiData = aiSnap.exists ? aiSnap.data() : null;
    } catch(e) { aiData = null; }
  }
}

function buildSlides() {
  slides = [{ type: 'cover' }];
  if (aiData && aiData.narrativa)    slides.push({ type: 'ai_narrativa' });
  DIMS.forEach(d => slides.push({ type: 'dimension', dimKey: d.key }));
  if (aiData && aiData.focusSesion)  slides.push({ type: 'ai_foco' });
  slides.push({ type: 'cierre' });
}

// ── Init ────────────────────────────────────────────────────────────
const _params = new URLSearchParams(location.search);
workspaceId   = _params.get('workspaceId') || '';
teamId        = _params.get('equipoId')    || '';
const _ciclo  = _params.get('ciclo')       || '';

auth.onAuthStateChanged(async (user) => {
  if (!user) { loading = false; currentUser = null; render(); return; }
  currentUser = user;
  if (teamId) {
    await loadData(user.uid, _ciclo);
    buildSlides();
  }
  loading = false;
  render();
});
</script>
